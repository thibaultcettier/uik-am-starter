<mat-card class="app-card__container">
  <div class="app-card__image-wrapper">
    <mat-checkbox
      class="app-card__checkbox"
      [class.app-card__checkbox--hidden]="!isSelected"
      [checked]="isSelected"
      (change)="onCheckboxChange($event)"
      (click)="$event.stopPropagation()">
    </mat-checkbox>
    <img [src]="imageUrl" [alt]="title" class="app-card__image" loading="lazy" />
    @if (showDemoOverlay) {
      <div class="app-card__overlay">
        <div class="app-card__overlay-content">
          <div class="app-card__overlay-header">
            <img
              alt="logo"
              class="app-card__overlay-logo uik-brand-logo"
              src="/assets/img/logo.svg"
            />
            <span class="app-card__overlay-title">visiativ</span>
          </div>
          <span class="app-card__overlay-subtitle">Demo</span>
        </div>
      </div>
    }
  </div>

  <mat-card-content class="app-card__content">
    <h3 class="app-card__title uik-h6">{{ title }}</h3>
    <p class="app-card__product-id uik-body-small">{{ productId }}</p>
  </mat-card-content>

  <mat-card-actions class="app-card__actions">
    <button mat-button class="app-card__action-button" (click)="onAddToCart($event)">
      <img src="/assets/img/shopping_cart.svg" alt="shopping cart" class="app-card__action-icon-img" />
      <span class="app-card__action-icon-text uik-body-semibold">Add to cart</span>
    </button>
    <button mat-icon-button class="app-card__action-icon" (click)="onFavorite($event)" aria-label="Add to favorites">
      <mat-icon>star</mat-icon>
    </button>
    <button mat-icon-button class="app-card__action-icon" (click)="onInfo($event)" aria-label="Product information">
      <mat-icon>info</mat-icon>
    </button>
    <button mat-icon-button class="app-card__action-icon" [matMenuTriggerFor]="menu" (click)="onMoreOptions($event)" aria-label="More options">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onSelectThisProduct($event)">
        <mat-icon>check_box</mat-icon>
        <span>Select this product</span>
      </button>
      <button mat-menu-item (click)="onOpenDetails($event)">
        <mat-icon>info</mat-icon>
        <span>Open details</span>
      </button>
    </mat-menu>
  </mat-card-actions>
</mat-card>
