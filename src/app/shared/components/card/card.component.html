<mat-card class="app-card__container">
  <div class="app-card__image-wrapper">
    <img [src]="imageUrl" [alt]="title" class="app-card__image" />
    @if (showDemoOverlay) {
      <div class="app-card__overlay">
        <div class="app-card__overlay-content">
          <div class="app-card__overlay-header">
            <img
              alt="logo"
              class="app-card__overlay-logo uik-brand-logo"
              src="/assets/img/logo.svg"
            />
            <span class="app-card__overlay-title">visiativ</span>
          </div>
          <span class="app-card__overlay-subtitle">Demo</span>
        </div>
      </div>
    }
  </div>

  <mat-card-content class="app-card__content">
    <h3 class="app-card__title">{{ title }}</h3>
    <p class="app-card__product-id">{{ productId }}</p>
  </mat-card-content>

  <mat-card-actions class="app-card__actions">
    <button mat-button class="app-card__action-button" (click)="onAddToCart()">
      <img src="/assets/img/shopping_cart.svg" alt="shopping cart" class="app-card__action-icon-img" />
      <span class="app-card__action-icon-text">Add to cart</span>
    </button>
    <button mat-icon-button class="app-card__action-icon" (click)="onFavorite()" aria-label="Add to favorites">
      <mat-icon>star</mat-icon>
    </button>
    <button mat-icon-button class="app-card__action-icon" (click)="onInfo()" aria-label="Product information">
      <mat-icon>info</mat-icon>
    </button>
    <button mat-icon-button class="app-card__action-icon" (click)="onMoreOptions()" aria-label="More options">
      <mat-icon>more_vert</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
