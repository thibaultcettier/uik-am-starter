<mat-toolbar class="uik-header-large uik-color-white-bg uik-outlined-bottom app-page-header__toolbar">
  @if (layoutMatchesSmallViewport()) {
    <button mat-icon-button (click)="toggleSidenav()" class="me-1">
      <mat-icon aria-label="Toggle sidenav">menu</mat-icon>
    </button>
  }

  <div class="app-page-header__info">
    <span class="app-page-header__title">{{ title }}</span>
    @if (subtitle) {
      <span class="app-page-header__subtitle">{{ subtitle }}</span>
    }
  </div>

  <span class="app-page-header__spacer"></span>

  <div class="app-page-header__actions">
    <button mat-icon-button aria-label="Favorites">
      <mat-icon>star</mat-icon>
    </button>
    <button mat-icon-button aria-label="Cart">
      <mat-icon>shopping_cart</mat-icon>
    </button>
    <button mat-icon-button aria-label="Help">
      <mat-icon>help_outline</mat-icon>
    </button>

    <button mat-stroked-button class="app-page-header__user">
      <div class="app-page-header__user-content">
        <span class="app-page-header__user-avatar">{{ userInitials }}</span>
        <span class="app-page-header__user-name">{{ userName }}</span>
      </div>
      <mat-icon>expand_more</mat-icon>
    </button>
  </div>
</mat-toolbar>
